[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "street-art-photo-assistant"
version = "0.1.0"
description = "Cluster, geotag, tag, and compare street-art photos."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "Flask>=3.1,<4",
  "Pillow>=11,<13",
  "piexif>=1.1.3,<2",
  "iptcinfo3>=2.1.4,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
visual = [
  "numpy>=2,<3",
  "opencv-python>=4.11,<5",
]

[project.scripts]
street-art-photo-assistant = "street_art_photo_assistant.__main__:main"

[tool.setuptools.package-data]
street_art_photo_assistant = ["templates/*.html", "static/*.css"]

[tool.unittest]
start-directory = "tests"

